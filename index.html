<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>철원 도시기록 조사단</title><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body>
<title>철원 도시기록 조사단</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: 두루 작전 서식을 폰 화면으로 옮긴 야전 단말. 위에서 아래로 교신(채팅) 피드, 아래에 지금 해야 할 한 가지(독), 맨 아래 4개 탭. */
:root{
  --bg:#E6ECEF; --grid:rgba(24,36,52,.07);
  --paper:#F7F9FA; --paper2:#EDF1F4;
  --ink:#152033; --ink2:#46536A; --line:#C2CBD4;
  --navy:#182434; --navy-ink:#EAEFF3;
  --accent:#B8470F; --on-accent:#FFFFFF; --hot:#EE7D43;
  --ok:#1F7A4D; --bad:#B3261E;
  --hs:#182434; --hs-ink:#EAEFF3;
  --me:#D9E5EE; --me-ink:#152033;
  --ops-line:#7C8898;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,'Noto Sans KR',monospace;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1520; --grid:rgba(200,215,230,.05);
  --paper:#162131; --paper2:#1C293C;
  --ink:#E8EDF2; --ink2:#A6B2C0; --line:#2D3C51;
  --navy:#0A1018; --navy-ink:#E8EDF2;
  --accent:#F2955F; --on-accent:#1B1008;
  --ok:#58C08A; --bad:#FF8F86;
  --hs:#22344D; --hs-ink:#E8EDF2;
  --me:#2B3D55; --me-ink:#E8EDF2;
  --ops-line:#6D7C90; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1520; --grid:rgba(200,215,230,.05);
  --paper:#162131; --paper2:#1C293C;
  --ink:#E8EDF2; --ink2:#A6B2C0; --line:#2D3C51;
  --navy:#0A1018; --navy-ink:#E8EDF2;
  --accent:#F2955F; --on-accent:#1B1008;
  --ok:#58C08A; --bad:#FF8F86;
  --hs:#22344D; --hs-ink:#E8EDF2;
  --me:#2B3D55; --me-ink:#E8EDF2;
  --ops-line:#6D7C90; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;color:var(--ink);font:17px/1.55 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
#app{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.mono{font-family:var(--mono);letter-spacing:.02em}

/* header + nav */
.hdr{flex:none;display:flex;align-items:center;gap:12px;background:var(--navy);color:var(--navy-ink);padding:10px 12px;border-radius:0 0 14px 14px}
.logo{width:44px;height:44px;border-radius:50%;border:2px solid var(--navy-ink);background:transparent;color:var(--navy-ink);font-weight:900;font-size:13px;white-space:nowrap;padding:0;flex:none;position:relative}
.logo::after{content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--hot)}
.hd-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.hd-t b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-t span{font-size:12.5px;opacity:.8}
.icon{width:44px;height:44px;border-radius:50%;border:2px solid var(--navy-ink);background:transparent;color:var(--navy-ink);font-weight:700;font-size:20px;flex:none}
.stripe{flex:none;height:6px;margin:0 14px;background:repeating-linear-gradient(135deg,var(--hot) 0 10px,transparent 10px 20px);opacity:.9}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0 4px}
.tab{min-height:54px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink2);font-weight:700;font-size:14.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.tab small{font-family:var(--mono);font-size:10.5px;font-weight:600;opacity:.8}
.tab[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.tab[disabled]{opacity:.45}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 0 12px;display:flex;flex-direction:column;gap:12px}
main>*,.full>*,.dock>*,.panel>*,.opsin>*,.card>*,.sheet>*{flex-shrink:0}

/* buttons */
.btn{min-height:58px;width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:19px;padding:12px 18px}
.btn.sec{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink2);border:2px dashed var(--line);font-weight:700;font-size:16px;min-height:48px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:46px;font-size:16px;width:auto;padding:8px 16px;border-radius:12px}

/* full-screen start screens */
.full{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:22px 2px}
.full.welcome{justify-content:flex-start;gap:12px;padding:12px 0}
.full>.poster{flex:1 1 auto;min-height:0;width:100%;object-fit:contain}
.full h1{margin:0;font-size:36px;line-height:1.15;font-weight:900;text-wrap:balance}
.full h2{margin:0;font-size:26px;line-height:1.25;font-weight:900;text-wrap:balance}
.kicker{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.03em}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hot);margin-right:8px;animation:pl 1.2s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.note{font-size:15.5px;color:var(--ink2);line-height:1.6}
.safe{border-left:5px solid var(--hot);background:var(--paper);padding:12px 14px;border-radius:0 12px 12px 0;font-size:16px;font-weight:500}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--ink2)}
.field input,.field textarea{width:100%;min-height:54px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-size:18px}
.field textarea{min-height:92px;resize:vertical}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seat{min-height:76px;border-radius:14px;border:2px solid var(--ink);background:var(--paper);font-weight:900;font-size:30px;font-family:var(--mono)}
.seat[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:16.5px;font-weight:500;padding:12px;border-radius:12px;background:var(--paper);border:2px solid var(--line)}
.check input{width:26px;height:26px;margin-top:2px;flex:none;accent-color:var(--accent)}

/* feed */
.msg{display:flex;flex-direction:column;gap:3px;max-width:92%}
.msg .who{font-size:13px;font-weight:700;color:var(--ink2);padding-left:6px}
.bub{padding:12px 15px;border-radius:16px;font-size:18px;line-height:1.55;overflow-wrap:anywhere}
.msg.hs{align-self:flex-start}
.msg.hs .bub{background:var(--hs);color:var(--hs-ink);border-top-left-radius:5px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--me);color:var(--me-ink);border-top-right-radius:5px}
.msg.ops{align-self:center;max-width:100%}
.msg.ops .bub{background:transparent;border:2px dashed var(--ops-line);color:var(--ink);font-size:16.5px;font-weight:500}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:16px;border-top-left-radius:5px;background:var(--hs)}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--hs-ink);opacity:.4;animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.25}50%{opacity:1}}
.pc{width:100%;max-width:420px;border-radius:12px;border:2px solid var(--line);background:#fff;display:block}
.ph{width:min(260px,100%);border-radius:12px;border:2px solid var(--line);overflow:hidden;background:#fff}
.ph svg{display:block;width:100%;height:auto}
.ph-cap{font-size:13.5px;color:var(--ink2);padding:6px 4px 0}
.intro{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.intro .q{font-size:23px;font-weight:900;line-height:1.3;text-wrap:balance}
.stamp{align-self:center;border:4px solid var(--accent);color:var(--accent);border-radius:12px;padding:10px 22px;font-weight:900;font-size:26px;transform:rotate(-4deg);letter-spacing:.06em;background:var(--paper)}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:19px;font-weight:900}
.lockrow{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--paper2);border:2px dashed var(--line)}
.lockrow svg{flex:none;width:30px;height:30px;color:var(--ink2)}
.lockrow b{display:block;font-size:18px}
.lockrow span{font-size:15px;color:var(--ink2);display:block}
.lockrow q{display:block;font-size:16.5px;font-weight:500;margin-top:4px;quotes:none;color:var(--ink)}
.codebox{font-family:var(--mono);font-size:15px;background:var(--paper2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper2);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:24px;font-family:var(--mono)}
.stats span{font-size:13px;color:var(--ink2)}

/* dock */
.dock{flex:none;background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:2px;max-height:52%;overflow-y:auto}
.dock .lead{font-size:16px;font-weight:700;margin:0}
.dock .small{font-size:14px;color:var(--ink2);margin:0}
.preview{background:var(--me);color:var(--me-ink);border-radius:14px;padding:11px 14px;font-size:17px;font-weight:500}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{min-height:92px;border-radius:14px;border:2px solid var(--line);background:var(--paper2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px}
.slot small{font-size:13px;font-weight:700;color:var(--ink2)}
.slot b{font-family:var(--mono);font-size:38px;line-height:1.1}
.slot em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--accent)}
.slot[aria-pressed="true"]{border-color:var(--hot);border-width:4px;background:var(--paper)}
.slot.mine{border-color:var(--ink);background:var(--me);color:var(--me-ink)}
.slot.mine small{color:var(--me-ink)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{min-height:56px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-family:var(--mono);font-weight:600;font-size:26px}
.pad button.del{font-family:var(--sans);font-size:15px;font-weight:700}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pbtn{border:3px solid var(--line);background:var(--paper2);border-radius:12px;padding:4px;display:flex;flex-direction:column;gap:4px;text-align:left}
.pbtn[aria-pressed="true"]{border-color:var(--hot);background:var(--paper)}
.pbtn svg{width:100%;height:auto;border-radius:8px;display:block}
.pbtn span{font-size:12.5px;font-weight:700;line-height:1.3;padding:0 2px 2px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rate button{min-height:56px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-family:var(--mono);font-weight:600;font-size:24px}
.rate button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}

/* sheets (미션지, 신분증, 조사서) */
.sheet{background:var(--paper);border:2px solid var(--ink);border-radius:16px;overflow:hidden}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--navy);color:var(--navy-ink);padding:8px 12px;font-family:var(--mono);font-size:13px;font-weight:600}
.sh-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.sh-body h2{margin:0;font-size:25px;line-height:1.3;font-weight:900;text-wrap:balance}
.lab{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.03em;color:var(--accent);margin:0 0 4px}
.sh-body p{margin:0}
.big{font-size:20px;line-height:1.6;font-weight:500}
.facts{background:var(--paper2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:19px;line-height:1.5}
.facts div::before{content:"▪ ";color:var(--accent)}
.obs{display:flex;flex-direction:column;gap:8px}
.obs label{display:flex;gap:12px;align-items:center;min-height:52px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;font-size:18px;font-weight:500;background:var(--paper)}
.obs input{width:26px;height:26px;flex:none;accent-color:var(--accent)}
.q{font-size:21px;line-height:1.5;font-weight:700}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);min-height:64px}
.choice .no{flex:none;width:40px;height:40px;border-radius:50%;background:var(--paper2);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:21px}
.choice .tx{font-size:18.5px;line-height:1.55;font-weight:500;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.choice[aria-pressed="true"]{border-color:var(--hot);border-width:4px;padding:10px}
.choice[aria-pressed="true"] .no{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.choice[disabled]{opacity:.7}
.picked{position:sticky;bottom:0;background:var(--navy);color:var(--navy-ink);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.picked .n{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;color:var(--hot)}
.picked p{margin:0;font-size:15px;line-height:1.4;flex:1}
.hintbox{display:flex;flex-direction:column;gap:8px}
.hintline{background:var(--hs);color:var(--hs-ink);padding:10px 14px;border-radius:12px;font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sw button{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;line-height:1.25}
.sw small{font-size:11.5px;font-weight:700;color:var(--ink2)}
.sw button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.sw button[aria-pressed="true"] small{color:var(--navy-ink)}
.idc{background:var(--paper);border:3px solid var(--navy);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.idc .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{border:2px solid var(--line);border-radius:10px;padding:6px 10px;min-height:56px;background:var(--paper2)}
.f small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.f b{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.f.wide{grid-column:1/-1}
.idhead{display:flex;gap:12px;align-items:center}
.idhead h2{margin:0;font-family:var(--mono);font-size:30px;letter-spacing:.14em;line-height:1}
.idhead p{margin:2px 0 0;font-size:15px;font-weight:700}
.emb{flex:none;width:74px;height:74px;border-radius:50%;border:3px solid var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper2);font-family:var(--mono);font-weight:600;font-size:11.5px;text-align:center;line-height:1.2}
.emb b{font-size:20px;font-family:var(--sans);font-weight:900;color:var(--accent)}
.steps{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--accent)}
.steps i{width:20px;height:20px;border:2px solid var(--ink);display:inline-block}
.steps i.on{background:var(--hot)}
.clue{border:3px double var(--ink);border-radius:12px;padding:18px 12px;text-align:center;font-size:26px;font-weight:900;line-height:1.35;background:var(--paper)}
.seal-slot{border:2px dashed var(--ink2);border-radius:10px;min-height:74px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--accent);font-size:20px}
.fn4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fn4 .f b{font-family:var(--mono);font-size:26px}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.words div{min-height:64px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;background:var(--paper2);color:var(--ink2)}
.words div.on{border-color:var(--accent);color:var(--accent);background:var(--paper);transform:rotate(-3deg);border-width:3px}
.locked{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;border:2px dashed var(--line);border-radius:16px;padding:20px;color:var(--ink2);font-size:18px;font-weight:500}

/* overlay (modal / ops) */
.ov{position:fixed;inset:0;z-index:20;background:rgba(8,12,18,.62);display:flex;align-items:flex-end;justify-content:center;padding:0 max(0px,env(safe-area-inset-left,0px)) 0 max(0px,env(safe-area-inset-right,0px))}
.ov .panel{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.ov h3{margin:0;font-size:22px;font-weight:900}
.pinshow{display:flex;gap:10px;justify-content:center}
.pinshow i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink)}
.pinshow i.on{background:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pinpad button{min-height:60px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-family:var(--mono);font-size:26px;font-weight:600}
.err{color:var(--bad);font-weight:700;font-size:15px;min-height:1.2em;text-align:center}
.opsfull{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.opsin{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.opsin h2{margin:0;font-size:24px;font-weight:900}
.opsin h3{margin:0;font-size:18px;font-weight:900}
.opsin section{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--ink2)}
.tbl td:first-child,.tbl th:first-child{white-space:nowrap}
.scroll-x{overflow-x:auto}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--navy);color:var(--navy-ink);border:2px solid var(--hot);padding:10px 16px;border-radius:12px;font-weight:700;font-size:15.5px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.dock{max-height:60%}.slot{min-height:76px}.pad button{min-height:48px}}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function role(){return ROLES[S.seat]||null;}
function picksDone(){var n=0;for(var k=1;k<=4;k++){if(S.picks[k])n++;}return n;}
function seatOfSlot(i){for(var k=1;k<=4;k++){if(ROLES[k].slot===i)return k;}return 0;}
function setPick(n){S.pick=n;if(S.solo)S.picks[S.seat]=n;}
function switchSeat(k){S.seat=k;S.pick=S.solo?(S.picks[k]||0):S.pick;idBack=false;}
function soloSwitch(){
  if(!S.solo)return '';
  var b=[3,1,2,4].map(function(k){var r=ROLES[k],p=S.picks[k];return '<button data-act="seatsw" data-n="'+k+'" aria-pressed="'+(S.seat===k)+'"><span>'+r.name+'</span><small>'+FN[r.slot]+(p?' · '+p+'번':'')+'</small></button>';}).join('');
  return '<div class="sw" role="group" aria-label="병과 바꾸기">'+b+'</div>';
}
function me(t){return {w:'me',t:t};}
function hs(t){return {w:'hs',t:t};}
function ops(t){return {w:'ops',t:t};}
function toast(m){toastMsg=m;clearTimeout(toastT);toastT=setTimeout(function(){toastMsg='';render();},2600);render();}
function push(entries){entries.forEach(function(e){S.log.push(e);});save();startReveal();}
function minutes(){var a=S.joinedAt||Date.now(),b=S.finishedAt||Date.now();return Math.max(1,Math.round((b-a)/60000));}
function today(){var d=new Date();return d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2);}
function copyText(txt){
  function fallback(){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast(ok?'복사했어요':'코드를 길게 눌러 복사해 주세요');}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('복사했어요');},fallback);return;}}catch(e){}
  fallback();
}

function judge(code){
  var ok=code.every(function(d,i){return d===CODE[i];});
  if(ok)return {ok:true};
  if(code.slice().sort().join('')===CODE.slice().sort().join(''))return {ok:false,order:true};
  for(var i=0;i<4;i++){if(code[i]!==CODE[i])return {ok:false,slot:i};}
  return {ok:false,order:true};
}

  var r=judge(code), out=[me('한상우, 여기 조사단. 기록번호 1930-CW, 수신 코드 '+code.join('')+'. 이상.'),hs('…기록을 대조한다.')];

/* ---------- 노출 순서(타이핑 연출) ---------- */
function startReveal(){clearTimeout(timer);loopReveal();}
function loopReveal(){
  if(revealIdx>=S.log.length){render();return;}
  forceBottom=true;render();
  var e=S.log[revealIdx];
  var wait=e.w==='me'||e.w==='mephoto'?380:(e.w==='card'||e.w==='img'?650:Math.min(1700,650+(e.t?e.t.length*16:0)));
  timer=setTimeout(function(){revealIdx++;loopReveal();},wait);
}
function skipReveal(){clearTimeout(timer);revealIdx=S.log.length;forceBottom=true;render();}

function sendCode(code){

  else if(st==='s1gather'){S.slots=CODE.slice();sendCode(CODE.slice());}
  else if(st==='s1photo'){sendPhoto('A');}

function viewConsent(){return '<div class="full"><div class="kicker">시작 전에</div><h2>이 체험판은 이렇게 동작해요</h2><div class="card"><div>▪ 한상우는 가상의 인물입니다.</div><div>▪ 입력한 별칭과 답은 이 휴대폰에만 저장됩니다.</div><div>▪ 네 사람이 각자 자기 휴대폰으로 진행하고, 답은 서로 말로 나눕니다. 혼자라면 네 병과를 모두 직접 풀어 볼 수 있어요.</div><div>▪ 체험이 끝난 뒤 설문조사에 참여하면 소정의 상품을 드립니다!</div></div><label class="check"><input type="checkbox" id="consent"'+(S.consent?' checked':'')+'><span>확인했어요</span></label><button class="btn" data-act="consentGo"'+(S.consent?'':' disabled')+' id="consentBtn">다음</button></div>';}
function viewJoin(){
  var seats='';for(var i=1;i<=4;i++){seats+='<button class="seat" data-act="seat" data-n="'+i+'" aria-pressed="'+(S.seat===i&&!S.solo)+'">'+i+'</button>';}
  return '<div class="full"><div class="kicker">조사단 등록</div><h2>내 번호를 정하세요</h2><p class="note" style="font-size:17px">같은 팀원끼리 서로 다른 번호를 고르세요. 가위바위보로 정해도 좋아요. 번호에 따라 병과가 정해집니다.</p><div class="seats">'+seats+'</div><div class="field"><label for="nm">별칭 (선택)</label><input id="nm" maxlength="12" autocomplete="off" value="'+esc(S.name)+'" placeholder="예: 홍길동"></div><div class="field"><label for="tm">팀 이름 (선택)</label><input id="tm" maxlength="12" autocomplete="off" value="'+esc(S.team)+'" placeholder="예: 1조"></div><button class="btn" data-act="joinGo"'+(S.seat&&!S.solo?'':' disabled')+'>신분증 받기</button><button class="btn sec" data-act="soloGo">혼자서 체험하기 (네 병과 모두)</button></div>';}
function stepsHTML(n){var s='<div class="steps">작전 진행 단계 ';for(var i=1;i<=4;i++)s+='<i class="'+(i<=n?'on':'')+'"></i>';return s+'</div>';}

   '<div class="row"><div class="f wide"><small>성명</small><b>'+esc(S.name||'미기재')+'</b></div><div class="f"><small>병과</small><b>'+r.name+'</b></div><div class="f"><small>소속</small><b>철원 조사단</b></div><div class="f"><small>조</small><b>'+esc(S.team||'-')+'</b></div><div class="f"><small>배속일</small><b class="mono">'+today()+'</b></div><div class="f wide"><small>일련 번호</small><b class="mono">DR-1-0-'+r.serial+'</b></div></div><p class="note" style="margin:0">'+esc(r.def)+'</p></div>';
  var back='<div class="idc"><div class="idhead"><div><h2 style="font-size:21px;letter-spacing:.06em">임무 지령서</h2><p class="mono">문서 1-0 · 1단계 · 철원역사문화공원</p></div></div><div><p class="lab">임무</p><p class="big">철원역사문화공원에서 아래 단서의 장소를 찾아 관찰하라.</p></div><div><p class="lab">단서</p><div class="clue">'+esc(r.clue)+'</div></div><div class="row"><div class="f wide"><small>교신 규칙</small><b>찾은 번호는 말로 나눈다. 카드는 보여 주지 않는다.</b></div></div><div class="seal-slot">'+(S.sealed?'해독 완료':'해독 완료 날인 칸')+'</div></div>';
  return soloSwitch()+'<div class="seg"><button data-act="idside" data-b="0" aria-pressed="'+(!idBack)+'">앞면</button><button data-act="idside" data-b="1" aria-pressed="'+idBack+'">뒷면</button></div>'+(idBack?back:front);
}

  var ans=[3,2,1,4].map(function(k){var r=ROLES[k];return '<tr><td>'+FN[r.slot]+'</td><td>'+r.name+'</td><td>'+esc(r.place)+'</td><td><b>'+r.answer+'</b></td></tr>';}).join('');
  // 정답표는 코드 자리 순서로 정렬
  ans=[3,1,2,4].map(function(k){var r=ROLES[k];return '<tr><td>'+FN[r.slot]+'</td><td>'+r.name+'</td><td>'+esc(r.place)+'</td><td><b>'+r.answer+'</b></td></tr>';}).join('');
  var hintRows=FN.map(function(f,i){return '<tr><td>'+f+'</td><td>'+esc(HINTS[i][0])+'</td><td>'+esc(HINTS[i][1])+'</td></tr>';}).join('');
  return '<div class="opsfull"><div class="opsin"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>운영자 화면</h2><button class="btn sm sec" data-act="opsclose">닫기</button></div>'+
   '<section><h3>이 휴대폰에서 단계 이동 (시연용)</h3><p class="note" style="margin:0">선택한 화면 직전까지의 교신과 답이 채워진 상태로 이동합니다. 현재 번호: '+(S.seat||'없음')+'</p><div class="jump">'+jump+'</div><button class="btn sm sec" data-act="opsreset" style="width:100%">처음 화면으로 초기화</button></section>'+
   '<section><h3>1단계 정답표</h3><div class="scroll-x"><table class="tbl"><thead><tr><th>자리</th><th>병과</th><th>시설</th><th>정답</th></tr></thead><tbody>'+ans+'</tbody></table></div><p class="note" style="margin:0">수신 코드 <b class="mono">3142</b> · 사진 단계는 샘플 선택 (역 이름표와 모노레일 안내가 한 화면에 보이는 첫 번째 사진이 정답, 나머지는 재촬영 안내)</p></section>'+
   '<section><h3>힌트표 (요청 시 한상우가 보내는 문장)</h3><div class="scroll-x"><table class="tbl"><thead><tr><th>막힌 곳</th><th>1단</th><th>2단</th></tr></thead><tbody>'+hintRows+'</tbody></table></div><p class="note" style="margin:0">미션지 열람 20분 후에도 번호를 못 정하면 1단 힌트가 자동으로 갑니다.</p></section>'+
   '<section><h3>현장 대응</h3><table class="tbl"><tbody><tr><td>코드가 안 맞음</td><td>한상우가 틀린 자리의 도시 기능을 알려 줍니다. 정답 번호는 말하지 않습니다.</td></tr><tr><td>막혀서 못 진행</td><td>참가자 화면 위 ? → 스태프 호출 → 확인 번호 입력 → 이 단계 통과시키기</td></tr><tr><td>번호가 겹침</td><td>팀원끼리 서로 다른 번호가 되도록 다시 정하게 하고, 필요하면 ? → 처음부터 다시</td></tr><tr><td>혼자 온 참가자</td><td>번호 고르는 화면의 ‘혼자서 체험하기’를 누르면 네 병과 미션을 한 폰에서 모두 풀 수 있습니다.</td></tr><tr><td>화면이 멈춘 듯함</td><td>새로 고침해도 진행 상황이 유지됩니다.</td></tr></tbody></table></section>'+
   '</div></div>';
}

/* ---------- 렌더 ---------- */
function render(){
  var app=document.getElementById('app');if(!app)return;
  var mainEl=app.querySelector('main'),prevTop=mainEl?mainEl.scrollTop:0;
  var stick=mainEl?(mainEl.scrollHeight-mainEl.scrollTop-mainEl.clientHeight<90):true;
  var prevTab=app.getAttribute('data-tab');
  var step=S.step,html='',pre=['welcome','consent','join','id'].indexOf(step)>=0;
  var ae=document.activeElement,aid=ae&&ae.id?ae.id:'',ss=null,se=null;
  try{if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&aid){ss=ae.selectionStart;se=ae.selectionEnd;}}catch(e){}
  if(step==='welcome')html=viewWelcome();
  else if(step==='consent')html=viewConsent();
  else if(step==='join')html=viewJoin();
  else if(step==='id'){
    html='<main>'+'<div class="kicker">조사단 신분 증명서</div>'+viewId()+'<button class="btn" data-act="idgo">교신 시작하기</button></main>';
  }else{
    var body=tab==='feed'?viewFeed():tab==='mission'?viewMission():tab==='id'?viewId():viewRecord();
    html='<main>'+body+'</main>'+(tab==='feed'?dockHTML():'');
  }
  var header='';
  if(step!=='welcome'&&step!=='consent'){
    header='<div class="hdr"><button class="logo" data-act="logo" aria-label="두루">두루</button><div class="hd-t"><b>철원 도시기록 조사단</b><span>'+(pre?'조사단 등록':stageLabel()+(S.solo?' · 혼자 체험':(role()?' · '+role().name:'')))+'</span></div>'+(pre?'':'<button class="icon" data-act="help" aria-label="도움말">?</button>')+'</div><div class="stripe"></div>';
  }
  var nav='';
  if(!pre&&step!=='welcome'){
    var ts=[['feed','교신','COMM'],['mission','미션지','MISSION'],['id','신분증','ID'],['record','조사서','RECORD']];
    nav='<nav class="tabs" aria-label="화면">'+ts.map(function(t){return '<button class="tab" data-act="tab" data-t="'+t[0]+'" aria-current="'+(tab===t[0])+'"><span>'+t[1]+'</span><small>'+t[2]+'</small></button>';}).join('')+'</nav>';
  }
  var tst=toastMsg?'<div class="toast" role="status">'+esc(toastMsg)+'</div>':'';
  app.setAttribute('data-tab',tab);
  app.innerHTML=header+html+nav+modalHTML()+opsHTML()+tst;
  var m2=app.querySelector('main');
  if(m2){
    if(tab==='feed'&&(forceBottom||stick||prevTab!=='feed'))m2.scrollTop=m2.scrollHeight;
    else m2.scrollTop=(prevTab===tab?prevTop:0);
  }
  forceBottom=false;
  if(aid){var el=document.getElementById(aid);if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){try{el.focus({preventScroll:true});if(ss!=null)el.setSelectionRange(ss,se);}catch(e){}}}
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),d=el.dataset;
  if(a==='ovclose'){if(ev.target===el){modal=null;pinBuf='';pinErr='';render();}return;}
  switch(a){
    case 'start':go('consent');break;
    case 'consentGo':if(S.consent)go('join');break;
    case 'seat':S.solo=false;S.seat=+d.n;save();render();break;
    case 'soloGo':S.solo=true;S.seat=1;S.pick=0;S.joinedAt=S.joinedAt||Date.now();go('id');break;
    case 'seatsw':switchSeat(+d.n);save();render();{var mm=document.querySelector('main');if(mm)mm.scrollTop=0;}break;
    case 'slotgo':switchSeat(+d.k);tab='mission';save();render();{var m3=document.querySelector('main');if(m3)m3.scrollTop=0;}break;
    case 'joinGo':if(S.seat&&!S.solo){S.joinedAt=S.joinedAt||Date.now();go('id');}break;
    case 'idside':idBack=d.b==='1';render();break;
    case 'idgo':go('call0');tab='feed';render();break;
    case 'tab':tab=d.t;if(tab==='feed')forceBottom=true;render();break;
    case 'call0':S.step='s1open';save();push(scrCall0());break;
    case 'open1':S.missionStart=Date.now();S.step='s1mission';tab='mission';save();render();break;
    case 'tabMission':tab='mission';render();break;
    case 'pick':if(S.step==='s1mission'||S.step==='s1gather'){setPick(+d.n);save();render();}break;
    case 'obs':S.obs[S.seat+'_'+d.i]=el.checked;save();break;
    case 'mhint':if(role())requestHint(role().slot);break;
    case 'toGather':if(S.solo?picksDone()===4:S.pick){S.step='s1gather';tab='feed';selSlot=-1;save();forceBottom=true;render();}break;
    case 'slot':if(+d.i!==role().slot){selSlot=+d.i;render();}break;
    case 'digit':
      if(S.step==='s1gather'){var i=selSlot;if(i>=0){S.slots[i]=+d.n;save();
        if(+d.n>0){var cur=codeNow(),nxt=-1;for(var k=1;k<=4;k++){var j=(i+k)%4;if(j!==role().slot&&!cur[j]){nxt=j;break;}}if(nxt>=0)selSlot=nxt;}
        render();}}break;
    case 'sendcode':{var c=codeNow();if(c.every(function(x){return x>0;}))sendCode(c);break;}
    case 'hintToggle':hintOpen=!hintOpen;render();break;
    case 'hint':requestHint(+d.i);break;
    case 'hintGo':modal=null;hintOpen=true;tab='feed';render();break;
    case 'photo':photoSel=d.k;render();break;
    case 'sendphoto':if(photoSel)sendPhoto(photoSel);break;
    case 'teaser':S.step='teaser';save();push(scrTeaser());break;
    case 'toFeedback':go('feedback');forceBottom=true;break;
    case 'fun':S.fun=+d.n;save();render();break;
    case 'tag':{var ti=+d.i,p=S.tags.indexOf(ti);if(p>=0)S.tags.splice(p,1);else S.tags.push(ti);save();render();break;}
    case 'finish':S.finishedAt=Date.now();S.step='end';save();push([{w:'card',k:'claim'}]);break;
    case 'copyres':copyText(resultCode());break;
    case 'skip':skipReveal();break;
    case 'help':modal='help';render();break;
    case 'close':modal=null;pinBuf='';pinErr='';resetArm=false;render();break;
    case 'pinStaff':modal='pin';pinBuf='';pinErr='';render();break;
    case 'pinkey':{
      if(d.n==='x'){pinBuf=pinBuf.slice(0,-1);}else if(pinBuf.length<4){pinBuf+=d.n;}
      pinErr='';
      if(pinBuf.length===4){
        if(pinBuf===PIN){pinBuf='';if(opsOpen&&!opsAuth){opsAuth=true;}else{modal='staff';}}
        else{pinBuf='';pinErr='확인 번호가 달라요';}
      }
      render();break;}
    case 'staffSkip':staffSkip();break;
    case 'openops':modal=null;opsOpen=true;opsAuth=true;render();break;
    case 'opsclose':opsOpen=false;opsAuth=false;pinBuf='';pinErr='';render();break;
    case 'logo':{
      var now=Date.now();logoTaps=logoTaps.filter(function(t){return now-t<3000;});logoTaps.push(now);
      if(logoTaps.length>=5){logoTaps=[];opsOpen=true;opsAuth=false;pinBuf='';pinErr='';render();}
      break;}
    case 'opsadd':{
      var inp=document.getElementById('opsin'),v=inp?inp.value.trim():'';
      var p2=v.split('|');
      if(p2.length===7&&p2[0]==='DR1'&&!isNaN(parseFloat(p2[4]))&&!isNaN(parseFloat(p2[6]))){var arr=opsData();arr.push(p2);opsSave(arr);opsMsg='추가했어요';}
      else{opsMsg='형식이 달라요. 참가자의 결과 코드를 그대로 붙여 넣어 주세요.';}
      render();break;}
    case 'opsdel':{var arr2=opsData();arr2.splice(+d.i,1);opsSave(arr2);opsMsg='';render();break;}
    case 'opsclear':if(el.getAttribute('data-arm')==='1'){opsSave([]);opsMsg='모두 지웠어요';render();}else{el.setAttribute('data-arm','1');el.textContent='한 번 더 누르면 모두 지웁니다';}break;
    case 'opscopy':{var rs=opsData();copyText('팀\t번호\t병과\t분\t힌트\t재미\n'+rs.map(function(r){return [r[1],r[2],r[3],r[4],r[5],r[6]].join('\t');}).join('\n'));break;}
    case 'jump':jumpTo(d.s);break;
    case 'opsreset':resetAll();break;
    case 'resetArm':resetArm=true;render();break;
    case 'resetGo':resetAll();break;
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='consent'){S.consent=t.checked;save();var b=document.getElementById('consentBtn');if(b)b.disabled=!t.checked;}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='nm'){S.name=t.value.slice(0,12);save();}
  else if(t.id==='tm'){S.team=t.value.slice(0,12);save();}
  else if(t.id==='why'){S.rs=S.rs||{};S.rs[S.seat]=t.value;save();}
  else if(t.id==='cm'){S.comment=t.value;save();}
});

/* 시작: 이미 진행 중이면 이어서 */
if(['welcome','consent','join','id'].indexOf(S.step)<0&&revealIdx<S.log.length){revealIdx=S.log.length;}
if(S.step==='s1mission'||S.step==='s1gather'){tab=(S.step==='s1mission'&&!S.pick)?'mission':'feed';}
render();
})();
</script>

</body></html>
